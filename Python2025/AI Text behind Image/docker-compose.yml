version: '3.8'

services:
  app:
    build: .
    container_name: ai-text-behind-image
    ports:
      - "8501:8501"
    volumes:
      - ./output:/app/output
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=true
    restart: unless-stopped